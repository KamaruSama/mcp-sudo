[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-sudo"
version = "1.0.1"
description = "MCP server for running sudo commands with encrypted password storage. Part of likezara™ MCP suite."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary — © 2026 likezara" }
authors = [
    { name = "Kamaru", email = "k.kamarux@gmail.com" },
]
maintainers = [
    { name = "likezara", email = "contact@likezara.com" },
]
keywords = ["mcp", "sudo", "encryption", "fernet", "likezara"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Security",
]
dependencies = [
    "mcp>=1.27.0",
    "cryptography>=43.0.0",
]

[project.urls]
Homepage = "https://github.com/KamaruSama/mcp-sudo"
Repository = "https://github.com/KamaruSama/mcp-sudo"
Issues = "https://github.com/KamaruSama/mcp-sudo/issues"
Funding = "https://ko-fi.com/kamaru"

[project.scripts]
mcp-sudo = "mcp_sudo:main"

[tool.setuptools]
py-modules = ["mcp_sudo"]
